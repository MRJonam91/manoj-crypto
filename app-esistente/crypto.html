<script>
// ═══════════════════════════════════════════
// INDICATORI TECNICI
// ═══════════════════════════════════════════
function calcRSI(prices,period=14){
  if(!Array.isArray(prices)||prices.length<period+1)return null;
  let gains=0,losses=0;
  for(let i=1;i<=period;i++){const d=prices[i]-prices[i-1];if(d>0)gains+=d;else losses-=d;}
  let ag=gains/period,al=losses/period;
  for(let i=period+1;i<prices.length;i++){
    const d=prices[i]-prices[i-1];
    ag=(ag*(period-1)+Math.max(0,d))/period;
    al=(al*(period-1)+Math.max(0,-d))/period;
  }
  if(al===0)return 100;if(ag===0)return 0;
  return 100-100/(1+ag/al);
}
function getDailyRSI(sp){if(!sp||sp.length<15)return null;return calcRSI(sp.slice(-Math.min(48,sp.length)),14);}
function getWeeklyRSI(sp){
  if(!sp||sp.length<7)return null;
  const hpd=sp.length/7,daily=[];
  for(let i=1;i<=7;i++){const idx=Math.min(Math.round(i*hpd)-1,sp.length-1);if(sp[idx]!=null)daily.push(sp[idx]);}
  if(daily.length<7)return null;
  return calcRSI(daily,6);
}
function getVolatility(sp){
  if(!sp||sp.length<2)return null;
  const rets=[];
  for(let i=1;i<sp.length;i++)rets.push((sp[i]-sp[i-1])/sp[i-1]);
  const mean=rets.reduce((a,b)=>a+b,0)/rets.length;
  const v=rets.reduce((a,b)=>a+(b-mean)**2,0)/rets.length;
  return Math.sqrt(v)*100;
}
function generateSignal(c){
  const{rsi_1d:r1,price_change_percentage_1h_in_currency:ch1h,price_change_percentage_24h_in_currency:ch24,price_change_percentage_7d_in_currency:ch7d,total_volume:vol,market_cap:mc}=c;
  const vr=mc?vol/mc:0;
  if(r1!=null&&r1<30&&ch1h>0&&vr>0.05)return{type:'STRONG_BUY',label:'STRONG BUY',score:85+Math.min(15,30-r1),reason:'Oversold + reversal in atto',priority:1};
  if(r1!=null&&r1<40&&ch24>-5&&ch7d>0)return{type:'BUY',label:'BUY',score:65+Math.min(15,40-r1),reason:'Oversold con trend positivo settimanale',priority:2};
  if(r1!=null&&r1>70&&ch1h<0)return{type:'STRONG_SELL',label:'STRONG SELL',score:85+Math.min(15,r1-70),reason:'Overbought + correzione iniziata',priority:1};
  if(ch24>12&&vr>0.15&&(r1==null||r1<75))return{type:'BREAKOUT',label:'BREAKOUT',score:75+Math.min(20,ch24-12),reason:'Rottura rialzista con volumi alti',priority:2};
  if(ch24<-12&&vr>0.15)return{type:'BREAKDOWN',label:'BREAKDOWN',score:75+Math.min(20,-ch24-12),reason:'Rottura ribassista con volumi alti',priority:2};
  if(r1!=null&&r1>60&&ch24<3&&ch7d<0)return{type:'SELL',label:'SELL',score:60+Math.min(15,r1-60),reason:'Overbought con trend negativo',priority:3};
  if(r1!=null&&r1>=45&&r1<=65&&ch7d>5&&ch24>0)return{type:'ACCUMULATE',label:'ACCUMULATE',score:55+Math.min(20,ch7d),reason:'Uptrend solido, RSI neutro',priority:3};
  return null;
}
function calcTradeLevels(c){
  const sig=c.signal;if(!sig)return null;
  const price=c.current_price,vol=c.volatility||2;
  const isLong=['STRONG_BUY','BUY','BREAKOUT','ACCUMULATE'].includes(sig.type);
  const isShort=['STRONG_SELL','SELL','BREAKDOWN'].includes(sig.type);
  if(!isLong&&!isShort)return null;
  const riskPct=Math.max(0.02,Math.min(0.12,(vol/100)*1.5));
  const rr=sig.type.includes('STRONG')||sig.type==='BREAKOUT'?2.5:2.0;
  if(isLong){const sl=price*(1-riskPct),risk=price-sl;return{direction:'LONG',entry:price,stop_loss:sl,tp1:price+risk*1.2,tp2:price+risk*rr,tp3:price+risk*(rr*1.6)};}
  else{const sl=price*(1+riskPct),risk=sl-price;return{direction:'SHORT',entry:price,stop_loss:sl,tp1:price-risk*1.2,tp2:price-risk*rr,tp3:price-risk*(rr*1.6)};}
}
function sparklineSVG(data,positive,w=120,h=30){
  if(!data||data.length<2)return`<svg width="${w}" height="${h}"></svg>`;
  const min=Math.min(...data),max=Math.max(...data),range=max-min||1;
  const pts=data.map((v,i)=>[(i/(data.length-1))*w,h-((v-min)/range)*(h-2)-1]);
  const line=pts.map((p,i)=>`${i===0?'M':'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const area=`M${pts[0][0].toFixed(1)},${h} `+pts.map(p=>`L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')+` L${w},${h} Z`;
  const col=positive?'#a3e635':'#fb7185';
  const gid=`sg${Math.random().toString(36).slice(2,7)}`;
  return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${col}" stop-opacity=".35"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#${gid})"/><path d="${line}" stroke="${col}" stroke-width="1.5" fill="none" stroke-linejoin="round"/></svg>`;
}

const CGAPI='https://api.coingecko.com/api/v3';

const fmtP=n=>{if(n==null)return'—';if(n>=1e3)return n.toLocaleString('en-US',{maximumFractionDigits:0});if(n>=1)return n.toLocaleString('en-US',{maximumFractionDigits:2});if(n>=0.01)return n.toLocaleString('en-US',{maximumFractionDigits:4});return n.toLocaleString('en-US',{maximumFractionDigits:8});};
const fmtL=n=>{if(n==null)return'—';if(n>=1e12)return(n/1e12).toFixed(2)+'T';if(n>=1e9)return(n/1e9).toFixed(2)+'B';if(n>=1e6)return(n/1e6).toFixed(2)+'M';if(n>=1e3)return(n/1e3).toFixed(2)+'K';return n.toFixed(0);};
const fmtPct=(n,d=2)=>n==null?'—':(n>=0?'+':'')+n.toFixed(d)+'%';
const pct=(v,cls='')=>v==null?`<span class="mono text-muted">—</span>`:`<span class="mono ${v>=0?'up':'dn'} ${cls}">${fmtPct(v)}</span>`;
const rsiBadge=v=>{if(v==null)return`<span class="mono text-muted">—</span>`;let cls='rsi-neu';if(v<30)cls='rsi-os';else if(v>70)cls='rsi-ob';else if(v<45)cls='rsi-bear';else if(v>55)cls='rsi-bull';return`<span class="rsi-badge ${cls}">${v.toFixed(0)}</span>`;};
const sigBadge=sig=>{if(!sig)return'';const map={STRONG_BUY:'sig-sbuy',BUY:'sig-buy',BREAKOUT:'sig-brk',ACCUMULATE:'sig-acc',STRONG_SELL:'sig-ssell',SELL:'sig-sell',BREAKDOWN:'sig-brkd'};return`<span class="sig-badge ${map[sig.type]||''}">${sig.label}</span>`;};
const dirBadge=dir=>(!dir||dir==='NEUTRALE')?`<span class="dir-badge neu">NEUTRALE</span>`:`<span class="dir-badge ${dir==='LONG'?'long':'short'}">${dir}</span>`;

async function fetchAll(silent=false){
  if(!silent){ST.loading=true;render();}
  try{
    const[coinsR,globalR,trendR]=await Promise.allSettled([
      fetch(`${CGAPI}/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&sparkline=true&price_change_percentage=1h%2C24h%2C7d`),
      fetch(`${CGAPI}/global`),
      fetch(`${CGAPI}/search/trending`)
    ]);
    let fngData=null;
    try{const fr=await fetch(FNGAPI);if(fr.ok){const j=await fr.json();fngData=j?.data?.[0]||null;}}catch(_){}
    if(coinsR.status!=='fulfilled'||!coinsR.value.ok)throw new Error('Rate limit CoinGecko o errore di rete. Riprovo tra 60s.');
    const raw=await coinsR.value.json();
    ST.coins=raw.map(c=>{
      const sp=c.sparkline_in_7d?.price||[];
      const coin={...c,sparkline:sp,rsi_1d:getDailyRSI(sp),rsi_7d:getWeeklyRSI(sp),volatility:getVolatility(sp)};
      coin.signal=generateSignal(coin);coin.levels=calcTradeLevels(coin);return coin;
    });
    if(globalR.status==='fulfilled'&&globalR.value.ok){const g=await globalR.value.json();ST.global=g.data;}
    if(trendR.status==='fulfilled'&&trendR.value.ok){const t=await trendR.value.json();ST.trending=t.coins||[];}
    if(fngData)ST.fng=fngData;
    ST.lastUpdate=new Date();ST.error=null;
  }catch(e){ST.error=e.message||'Errore sconosciuto';}
  finally{ST.loading=false;render();}
}

async function requestAI(coinId){
  const coin=ST.coins.find(c=>c.id===coinId);
  if(!coin||ST.aiLoading.has(coinId))return;
  ST.aiLoading.add(coinId);renderAICard(coinId);
  const fngVal=ST.fng?parseInt(ST.fng.value,10):null;
  const mkt={fng:fngVal??'—',btcDom:ST.global?.market_cap_percentage?.btc?.toFixed(1)??'—',mcapChange:ST.global?.market_cap_change_percentage_24h_usd?.toFixed(2)??'—'};
  const payload={
    coin:{name:coin.name,symbol:coin.symbol.toUpperCase(),price:fmtP(coin.current_price),ch1h:(coin.price_change_percentage_1h_in_currency??0).toFixed(2),ch24h:(coin.price_change_percentage_24h_in_currency??0).toFixed(2),ch7d:(coin.price_change_percentage_7d_in_currency??0).toFixed(2),rsi1d:coin.rsi_1d!=null?coin.rsi_1d.toFixed(1):'—',rsi7d:coin.rsi_7d!=null?coin.rsi_7d.toFixed(1):'—',volatility:coin.volatility!=null?coin.volatility.toFixed(2):'—',volRatio:coin.market_cap?((coin.total_volume/coin.market_cap)*100).toFixed(2):'—',signal:coin.signal?coin.signal.label:'nessuno',rank:coin.market_cap_rank},
    market:mkt
  };
  try{
    const res=await fetch('api/ai.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await res.json();
    if(!res.ok||data.error)throw new Error(data.error||'Errore server');
    ST.aiData[coinId]={ok:true,data};
  }catch(e){ST.aiData[coinId]={ok:false,error:e.message};}
  finally{ST.aiLoading.delete(coinId);renderAICard(coinId);}
}

  const cls=isOver?'up':'dn',lbl=isOver?'OVERSOLD':'OVERBOUGHT',pLbl=period==='1d'?'1D':'7D';
  if(!filtered.length)return`<div class="rsi-box"><div class="rsi-box-head ${cls}">${lbl} · ${pLbl} <span class="rsi-count">0</span></div><div class="empty sm">Nessun asset</div></div>`;
  return`<div class="rsi-box"><div class="rsi-box-head ${cls}">${lbl} · ${pLbl} <span class="rsi-count">${filtered.length}</span></div>

function calcSentiment(coins,fngVal,classification){
  if(fngVal!=null)return{value:fngVal,label:classification?.toUpperCase()||'—'};
  if(!coins.length)return{value:null,label:null};
  const avg=coins.reduce((s,c)=>s+(c.price_change_percentage_24h_in_currency||0),0)/coins.length;
  const v=Math.max(0,Math.min(100,50+avg*2.5));
  let label='NEUTRAL';
  if(v>=75)label='EXTREME GREED';else if(v>=55)label='GREED';else if(v<=25)label='EXTREME FEAR';else if(v<=45)label='FEAR';
  return{value:Math.round(v),label};
}

  const coins=ST.coins,g=ST.global;
  const fngVal=ST.fng?parseInt(ST.fng.value,10):null;
  const sentiment=calcSentiment(coins,fngVal,ST.fng?.value_classification);
  const gainers=[...coins].sort((a,b)=>(b.price_change_percentage_24h_in_currency??-Infinity)-(a.price_change_percentage_24h_in_currency??-Infinity)).slice(0,5);
  const losers=[...coins].sort((a,b)=>(a.price_change_percentage_24h_in_currency??Infinity)-(b.price_change_percentage_24h_in_currency??Infinity)).slice(0,5);
  const volLead=[...coins].sort((a,b)=>{const ra=a.market_cap?a.total_volume/a.market_cap:0,rb=b.market_cap?b.total_volume/b.market_cap:0;return rb-ra;}).slice(0,5);

  app.innerHTML=`
    ${ST.error?`<div class="error-bar">⚠ ${ST.error}</div>`:''}
    <div class="ticker-wrap"><div class="ticker-live">● LIVE</div><div class="ticker-fade left"></div><div class="ticker-fade right"></div><div class="ticker">${buildTicker(coins)}</div></div>
    ${g?`<div class="kpi-bar">${buildKPI(g,coins,sentiment)}</div>`:''}
    <section class="section"><div class="sec-head"><div class="sec-title">Top 10 Live</div><div class="sec-sub mono">By Market Cap · sparkline 7gg · RSI 24h</div></div><div class="top10-grid">${buildTop10(coins)}</div></section>
    <div class="main-grid">
      <section class="section col-main">
        <div class="sec-head"><div class="sec-title" style="color:#a3e635">Segnali Trading</div><div class="sec-sub mono">RSI + variazione + Vol/MCap · entry/SL/TP algoritmici · AI su richiesta</div></div>
        <div id="signals-list">${buildSignals(coins)}</div>
        <p class="disclaimer">Segnali derivati algoritmicamente. <strong>Non costituiscono consulenza finanziaria.</strong></p>
      </section>
      <aside class="sidebar">${buildSidebar(ST.trending,gainers,losers,volLead)}</aside>
    </div>
    <section class="section">
      <div class="sec-head"><div class="sec-title" style="color:#22d3ee">Matrice RSI</div><div class="sec-sub mono">Oversold &lt;30 · Overbought &gt;70 · Wilder smoothing</div></div>
      <div class="rsi-grid">${buildRSI(coins,'1d','oversold')}${buildRSI(coins,'1d','overbought')}${buildRSI(coins,'7d','oversold')}${buildRSI(coins,'7d','overbought')}</div>
    </section>
    <section class="section">
      <div class="sec-head"><div class="sec-title">Top 100 · Full Matrix</div><div class="sec-sub mono">Clicca le intestazioni per ordinare</div></div>
      ${buildTable(coins,ST.sortKey,ST.sortDir)}
    </section>
    <footer class="footer">
      <div><div class="footer-title">Data Sources</div>CoinGecko Public API · alternative.me F&G<br><span class="text-muted">No API key · Auto-refresh 60s</span></div>
      <div><div class="footer-title">Indicatori</div>RSI Wilder(14) su sparkline orarie · RSI7D = Wilder(6) su 7 close daily</div>
      <div><div class="footer-title">Disclaimer</div><span class="text-muted">Strumento analitico informativo. <strong>Non è consulenza finanziaria.</strong></span></div>
    </footer>`;

  document.querySelectorAll('.sortable').forEach(th=>{
    th.addEventListener('click',()=>{
      const k=th.dataset.key;
      if(ST.sortKey===k)ST.sortDir=ST.sortDir==='desc'?'asc':'desc';
      else{ST.sortKey=k;ST.sortDir='desc';}
      render();
    });
  });
  Object.keys(ST.aiData).forEach(id=>{if(ST.aiData[id])renderAICard(id);});
  ST.aiLoading.forEach(id=>renderAICard(id));
}

function updateClock(){
  const el=document.getElementById('last-sync');
  if(!el||!ST.lastUpdate)return;
  const s=Math.max(0,Math.floor((ST.now-ST.lastUpdate.getTime())/1000));
  el.textContent=s<60?`${s}s ago`:`${Math.floor(s/60)}m ago`;
}

document.addEventListener('DOMContentLoaded',()=>{
  setInterval(()=>{ST.now=Date.now();updateClock();},1000);
  document.getElementById('btn-refresh').addEventListener('click',()=>{
    document.getElementById('btn-refresh').classList.add('spinning');
    fetchAll(false).finally(()=>document.getElementById('btn-refresh').classList.remove('spinning'));
  });
  fetchAll();
  setInterval(()=>fetchAll(true),REFRESH_MS);
});
</script>
</body>
</html>
